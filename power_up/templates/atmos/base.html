{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Atmos{% endblock %} — {% block venue_name %}Atmos{% endblock %}</title>
{% block refresh %}{% endblock %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0d0b0a;
    --bg-subtle: #14110f;
    --panel: #181412;
    --panel-card: #201b18;
    --panel-hover: #26201c;
    --line: rgba(255, 255, 255, 0.08);
    --line-subtle: rgba(255, 255, 255, 0.04);
    --line-gold: rgba(212, 175, 55, 0.28);
    
    --ink: #f7f3eb;
    --ink-secondary: #c4b9aa;
    --dim: #8e8477;
    --dim-subtle: #575047;
    
    --gold: #d4af37;
    --gold-light: #ecd178;
    --gold-hover: #e2be49;
    --gold-active: #bc9829;
    --gold-subtle: rgba(212, 175, 55, 0.12);
    --gold-glow: rgba(212, 175, 55, 0.22);
    
    --danger: #ef4444;
    --danger-subtle: rgba(239, 68, 68, 0.14);
    --success: #22c55e;
    --success-subtle: rgba(34, 197, 94, 0.14);
    --info: #38bdf8;
    --info-subtle: rgba(56, 189, 248, 0.14);

    --radius-xs: 4px;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --radius-full: 9999px;

    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.35);
    --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.5);
    --shadow-gold: 0 4px 18px rgba(212, 175, 55, 0.15);

    --font-serif: "Playfair Display", Georgia, "Times New Roman", serif;
    --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Consolas", monospace;

    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg);
    background-image: radial-gradient(circle at 50% 0%, #1f1813 0%, var(--bg) 75%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .wrap {
    max-width: 460px;
    margin: 0 auto;
    padding: 1.5rem 1.15rem 5rem;
    position: relative;
  }

  /* Typography */
  h1, h2, h3 {
    font-family: var(--font-serif);
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -0.01em;
  }

  h1 {
    font-size: 1.75rem;
    line-height: 1.25;
    margin-bottom: 0.35rem;
  }

  h2 {
    font-size: 1.35rem;
    line-height: 1.3;
  }

  .tag {
    color: var(--ink-secondary);
    font-size: 0.9rem;
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .tag-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.2rem 0.65rem;
    border-radius: var(--radius-full);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: var(--gold-subtle);
    color: var(--gold-light);
    border: 1px solid var(--line-gold);
  }

  .tag-badge-ghost {
    background: rgba(255, 255, 255, 0.05);
    color: var(--ink-secondary);
    border: 1px solid var(--line);
  }

  /* Containers & Panels */
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 1.25rem;
    margin-bottom: 1rem;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.2s var(--ease-smooth);
  }

  .panel-card {
    background: var(--panel-card);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 1rem;
    margin-bottom: 0.75rem;
    transition: transform 0.15s var(--ease-out), border-color 0.15s var(--ease-out);
  }

  .panel-gold {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.08) 0%, rgba(20, 17, 15, 0.95) 100%);
    border: 1px solid var(--line-gold);
    box-shadow: var(--shadow-gold);
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    width: 100%;
    text-align: center;
    padding: 0.85rem 1.25rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--gold);
    background: var(--gold);
    color: #120e0b;
    font-family: var(--font-sans);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 2px 10px rgba(212, 175, 55, 0.25);
    transition: transform 0.12s var(--ease-out), background-color 0.15s var(--ease-smooth), box-shadow 0.15s var(--ease-smooth);
    user-select: none;
  }

  @media (hover: hover) {
    .btn:hover {
      background: var(--gold-hover);
      border-color: var(--gold-hover);
      box-shadow: 0 4px 14px rgba(212, 175, 55, 0.35);
      text-decoration: none;
    }
  }

  .btn:active {
    transform: scale(0.97);
    background: var(--gold-active);
  }

  .btn-ghost {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line-gold);
    color: var(--gold-light);
    box-shadow: none;
  }

  @media (hover: hover) {
    .btn-ghost:hover {
      background: var(--gold-subtle);
      border-color: var(--gold);
      color: var(--gold);
      box-shadow: 0 2px 10px rgba(212, 175, 55, 0.15);
      text-decoration: none;
    }
  }

  .btn-small {
    width: auto;
    padding: 0.45rem 0.85rem;
    font-size: 0.82rem;
    border-radius: var(--radius-xs);
  }

  .btn-row {
    display: flex;
    gap: 0.75rem;
  }
  .btn-row .btn { flex: 1; }

  /* Inputs */
  input[type=text], input[type=number] {
    width: 100%;
    padding: 0.8rem 1rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: #080605;
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 0.95rem;
    transition: border-color 0.15s var(--ease-smooth), box-shadow 0.15s var(--ease-smooth);
  }

  input[type=text]:focus, input[type=number]:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
  }

  input::placeholder {
    color: var(--dim-subtle);
  }

  a {
    color: var(--gold);
    text-decoration: none;
    transition: color 0.15s ease;
  }
  a:hover {
    color: var(--gold-light);
    text-decoration: underline;
  }

  .muted {
    color: var(--dim);
    font-size: 0.85rem;
  }

  /* Menu Item Rows */
  .item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.85rem;
    padding: 0.85rem 0;
    border-bottom: 1px solid var(--line);
  }
  .item-row:last-child { border-bottom: none; }

  .item-info { flex: 1; min-width: 0; }
  .item-name {
    font-size: 1rem;
    font-weight: 600;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 0.4rem;
    flex-wrap: wrap;
  }
  .item-desc {
    color: var(--ink-secondary);
    font-size: 0.82rem;
    margin-top: 0.2rem;
    line-height: 1.4;
  }
  .price {
    color: var(--gold-light);
    font-weight: 600;
    font-size: 0.95rem;
    white-space: nowrap;
  }

  .qty-form {
    display: flex;
    gap: 0.4rem;
    align-items: center;
  }
  .qty-form input {
    width: 2.8rem;
    text-align: center;
    padding: 0.45rem 0.2rem;
    font-weight: 600;
  }

  .cat-title {
    margin: 1.75rem 0 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .cat-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--line-gold) 0%, transparent 100%);
  }

  /* Thermal Receipt / Ticket */
  .ticket-wrapper {
    position: relative;
    margin: 1.25rem 0;
    filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.6));
  }

  .ticket {
    background: #fdfbf7;
    color: #1a1715;
    border-radius: 4px 4px 0 0;
    padding: 1.35rem 1.15rem;
    font-family: var(--font-mono);
    white-space: pre-wrap;
    font-size: 0.82rem;
    line-height: 1.4;
    overflow-x: auto;
    border: 1px solid #ded6c8;
    border-bottom: none;
    position: relative;
  }

  .ticket-tear {
    height: 12px;
    background-color: #fdfbf7;
    background-image: radial-gradient(circle at 10px -5px, transparent 12px, #fdfbf7 13px);
    background-size: 20px 20px;
    background-repeat: repeat-x;
    border-left: 1px solid #ded6c8;
    border-right: 1px solid #ded6c8;
  }

  /* Status Pills & Progress Stepper */
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.25rem 0.75rem;
    border-radius: var(--radius-full);
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border: 1px solid var(--gold);
    color: var(--gold-light);
    background: var(--gold-subtle);
  }

  .progress-stepper {
    display: flex;
    justify-content: space-between;
    margin: 1.25rem 0 1.5rem;
    position: relative;
  }
  .progress-stepper::before {
    content: "";
    position: absolute;
    top: 14px;
    left: 15px;
    right: 15px;
    height: 2px;
    background: var(--line);
    z-index: 1;
  }
  .step-node {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4rem;
    flex: 1;
  }
  .step-circle {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--panel);
    border: 2px solid var(--dim-subtle);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--dim);
    transition: all 0.2s var(--ease-out);
  }
  .step-label {
    font-size: 0.72rem;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 500;
  }

  .step-node.active .step-circle {
    border-color: var(--gold);
    background: var(--gold);
    color: #120e0b;
    box-shadow: 0 0 12px var(--gold-glow);
  }
  .step-node.active .step-label {
    color: var(--gold-light);
    font-weight: 700;
  }

  .step-node.complete .step-circle {
    border-color: var(--success);
    background: var(--success);
    color: #ffffff;
  }
  .step-node.complete .step-label {
    color: var(--ink-secondary);
  }

  .alert {
    border: 1px solid var(--danger);
    background: var(--danger-subtle);
    color: #fca5a5;
    padding: 0.75rem 1rem;
    border-radius: var(--radius-sm);
    margin-bottom: 1rem;
    font-size: 0.9rem;
  }

  /* Cart Floating Bar (Sticky CTA) */
  .cart-fab {
    position: fixed;
    bottom: 1.25rem;
    left: 1rem;
    right: 1rem;
    max-width: 440px;
    margin: 0 auto;
    z-index: 100;
  }
  .cart-fab .btn {
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.7), 0 0 16px rgba(212, 175, 55, 0.35);
  }

  /* Live Pulse Animation */
  .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
    display: inline-block;
    box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
    animation: pulseLive 2s infinite;
  }

  @keyframes pulseLive {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
  }

  /* Staff KDS Dashboard Theme (body.staff) */
  body.staff {
    --bg: #0b0f19;
    --bg-subtle: #111827;
    --panel: #182234;
    --panel-card: #1f2d44;
    --panel-hover: #263650;
    --line: #2d3e58;
    --line-gold: rgba(56, 189, 248, 0.35);
    --ink: #f8fafc;
    --ink-secondary: #cbd5e1;
    --dim: #94a3b8;
    --gold: #38bdf8;
    --gold-light: #7dd3fc;
    --gold-hover: #0ea5e9;
    --gold-active: #0284c7;
    --gold-subtle: rgba(56, 189, 248, 0.12);
    --font-serif: var(--font-sans);
    background-image: radial-gradient(circle at 50% 0%, #172554 0%, #0b0f19 75%);
  }

  body.staff .wrap {
    max-width: 1200px;
    padding: 1.5rem;
  }

  .kds-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--line);
  }

  .kds-board {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.25rem;
  }
  @media (min-width: 768px) {
    .kds-board { grid-template-columns: repeat(3, 1fr); }
  }

  .kds-col {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 1rem;
    min-height: 480px;
  }

  .kds-col-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    padding-bottom: 0.65rem;
    border-bottom: 2px solid var(--line);
  }

  .kds-col-title {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    color: var(--ink-secondary);
  }

  .kds-col-count {
    background: var(--panel-card);
    padding: 0.15rem 0.55rem;
    border-radius: var(--radius-full);
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--gold-light);
    border: 1px solid var(--line);
  }

  .kds-card {
    background: var(--panel-card);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 1rem;
    margin-bottom: 0.85rem;
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s var(--ease-out), border-color 0.15s var(--ease-out);
  }

  .kds-card:hover {
    border-color: var(--gold);
  }

  .kds-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.5rem;
    margin-bottom: 0.4rem;
  }

  .kds-persona {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.25;
  }

  .kds-table-badge {
    background: var(--gold-subtle);
    color: var(--gold-light);
    border: 1px solid var(--line-gold);
    padding: 0.2rem 0.55rem;
    border-radius: var(--radius-sm);
    font-size: 0.8rem;
    font-weight: 700;
    white-space: nowrap;
  }

  .kds-meta {
    color: var(--dim);
    font-size: 0.8rem;
    margin-bottom: 0.75rem;
    display: flex;
    gap: 0.5rem;
  }

  .kds-items {
    list-style: none;
    font-size: 0.95rem;
    margin: 0.75rem 0;
    border-top: 1px solid var(--line);
    padding-top: 0.65rem;
  }

  .kds-items li {
    padding: 0.35rem 0;
    display: flex;
    align-items: baseline;
    gap: 0.4rem;
    color: var(--ink);
  }

  .kds-items .item-qty {
    font-weight: 700;
    color: var(--gold-light);
  }

  .kds-vignette {
    font-family: var(--font-mono);
    font-size: 0.76rem;
    color: var(--dim);
    background: #0f172a;
    border: 1px dashed var(--line);
    border-radius: var(--radius-sm);
    padding: 0.65rem;
    margin-top: 0.75rem;
    line-height: 1.4;
  }

  table.venues {
    width: 100%;
    border-collapse: collapse;
    margin-top: 1rem;
  }
  table.venues th {
    text-align: left;
    padding: 0.75rem 1rem;
    background: var(--panel-card);
    color: var(--ink-secondary);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--line);
  }
  table.venues td {
    padding: 0.85rem 1rem;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
  }
  table.venues tr:hover td {
    background: rgba(255, 255, 255, 0.02);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
{% block extra_head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
<div class="wrap">
{% block content %}{% endblock %}
</div>
</body>
</html>
