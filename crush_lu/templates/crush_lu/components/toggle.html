{% load i18n %}
{% comment %}
Reusable Crush.lu toggle switch.

Renders a real <input type="checkbox" role="switch"> (visually hidden but
still focusable and submitted with its form) followed by the painted track +
knob, all wrapped in a <label> so the switch is named by its text and a tap
anywhere on the row toggles it.

Required:
  label           Already-translated title next to the switch. Use _() in the
                  caller, e.g. label=_("Event Reminders").

Optional:
  help            Already-translated secondary line under the label.
  name            Input name. Omit for JS-only switches that never submit
                  (the push-preference switches save through fetch()).
  id              Input id. The wrapping <label> already names the input, so
                  only pass one when something else must point at it. With an
                  id the title gets <id>_label and the input is
                  aria-labelledby it, so the accessible name is the title
                  alone; `help` then gets <id>_help and becomes the
                  aria-describedby description (read once, not twice).
                  Without an id the label names the input with title + help.
  value           Input value (browsers submit "on" when omitted).
  checked         Truthy renders the switch on.
  disabled        Truthy disables the input and dims the row.
  tone            Checked colour + focus ring: "purple" (default), "green"
                  (WhatsApp) or "red" — the destructive variant, which also
                  colours the label (e.g. "Unsubscribe from ALL emails").
  inline          Truthy renders the compact one-line row (inline-flex,
                  vertically centred, small label, no help line) instead of
                  the default full-width row with the label/help stack.
  input_class     Extra classes on the <input> — JS event-delegation hooks
                  such as "push-pref-toggle", never styling.
  pref_key        Rendered as data-pref-key.
  subscription_id Rendered as data-subscription-id. Both are read by the
                  push-preference components' delegated change handlers.
  x_checked       Alpine :checked binding — a bare property name (CSP build).
  x_change        Alpine @change handler — a bare method name (CSP build).

Params you don't pass fall back to the caller's context ({% include %}
semantics); append `only` if that context defines one of these names.

Example:
  {% include "crush_lu/components/toggle.html" with name="email_marketing" checked=email_prefs.email_marketing label=_("Marketing & Promotions") help=_("Newsletters, special offers, and promotions") %}

Dark mode: the OFF track is dark:bg-gray-600 so it stands off the
dark:bg-gray-800 cards it sits on (the old per-page copies used
dark:bg-gray-800 and vanished). The knob stays white, and the checked track
keeps its tone colour because peer-checked:* out-specifies the dark: variant.
{% endcomment %}
<label{% if id %} for="{{ id }}"{% endif %} class="{% if inline %}inline-flex items-center{% else %}flex items-start{% endif %} {% if disabled %}cursor-not-allowed opacity-60{% else %}cursor-pointer{% endif %}">
    <span class="relative shrink-0{% if not inline %} mt-0.5{% endif %}">
        <input type="checkbox" role="switch" class="sr-only peer{% if input_class %} {{ input_class }}{% endif %}"{% if id %} id="{{ id }}"{% endif %}{% if name %} name="{{ name }}"{% endif %}{% if value %} value="{{ value }}"{% endif %}{% if subscription_id %} data-subscription-id="{{ subscription_id }}"{% endif %}{% if pref_key %} data-pref-key="{{ pref_key }}"{% endif %}{% if x_checked %} :checked="{{ x_checked }}"{% endif %}{% if x_change %} @change="{{ x_change }}"{% endif %}{% if id %} aria-labelledby="{{ id }}_label"{% if help and not inline %} aria-describedby="{{ id }}_help"{% endif %}{% endif %}{% if checked %} checked{% endif %}{% if disabled %} disabled{% endif %}>
        <span aria-hidden="true" class="block w-11 h-6 rounded-full bg-gray-200 dark:bg-gray-600 peer-focus:outline-none peer-focus:ring-4 {% if tone == 'red' %}peer-focus:ring-red-100 peer-checked:bg-red-500{% elif tone == 'green' %}peer-focus:ring-green-100 peer-checked:bg-green-600{% else %}peer-focus:ring-purple-100 peer-checked:bg-purple-600{% endif %} after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:h-5 after:w-5 after:rounded-full after:border after:border-gray-300 after:bg-white after:transition-all peer-checked:after:translate-x-full peer-checked:after:border-white"></span>
    </span>
    <span class="ml-3{% if inline %} text-sm{% else %} flex-1{% endif %}">
        <strong{% if id %} id="{{ id }}_label"{% endif %} class="{% if tone == 'red' %}text-red-600 dark:text-red-400{% else %}text-gray-900 dark:text-white{% endif %}">{{ label }}</strong>
        {% if help and not inline %}<span{% if id %} id="{{ id }}_help"{% endif %} class="block text-sm text-gray-500 dark:text-gray-400">{{ help }}</span>{% endif %}
    </span>
</label>
