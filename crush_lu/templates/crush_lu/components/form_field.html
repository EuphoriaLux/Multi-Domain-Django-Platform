{% comment %}
Reusable Crush.lu form field.

Renders <label> + <input/textarea/select> + errors + help-text in a single
consistent visual block. Accepts a Django bound field plus optional overrides.

Required:
  field           A bound Django form field, e.g. form.sender_description

Optional:
  label           Override field.label. Pass empty string "" to suppress label.
  help            Extra help text shown below the input (in addition to
                  field.help_text if Django provides one). Use {% trans %} in
                  the caller — pass an already-translated string.
  size            "sm" renders the label in the compact secondary style used
                  for sub-labels inside a grouped control (e.g. the From/To
                  pair of an age range). Default is the standard label style.
  label_class     Extra Tailwind classes appended to the <label>.
  field_class     Extra Tailwind classes appended to the input wrapper. Note:
                  Django form widget classes are set on the form class itself
                  (forms.py); this is for wrapper-level styling.

Example:
  {% include "crush_lu/components/form_field.html" with field=form.sender_description help=_("Be as specific as possible.") %}

The error and help paragraphs carry the ids the input's aria-describedby
points at: Django's own <auto_id>_error / <auto_id>_helptext, plus
<auto_id>_help for the caller's help (wired by with_descriptions). auto_id
includes the form prefix, so prefixed forms and formsets stay unique.
{% endcomment %}
{% load i18n form_field_tags %}
<div class="space-y-1 {{ field_class }}">
    {% if label != "" %}
        <label for="{{ field.id_for_label }}"
               class="block {% if size == 'sm' %}text-xs text-gray-500 dark:text-gray-400{% else %}text-sm font-medium text-gray-700 dark:text-gray-300{% endif %} {{ label_class }}">
            {{ label|default:field.label }}{% if field.field.required %}<span class="text-red-500" aria-hidden="true"> *</span>{% endif %}
        </label>
    {% endif %}
    {# A filter argument that isn't in the context raises, so only pass help when set. #}
    {% if help %}{{ field|with_descriptions:help }}{% else %}{{ field|with_descriptions }}{% endif %}
    {% if field.errors %}
        <p{% if field.auto_id %} id="{{ field.auto_id }}_error"{% endif %} class="text-red-500 dark:text-red-400 text-sm" role="alert">{{ field.errors.0 }}</p>
    {% endif %}
    {% if field.help_text %}
        <p{% if field.auto_id %} id="{{ field.auto_id }}_helptext"{% endif %} class="text-xs text-gray-400 dark:text-gray-500">{{ field.help_text|safe }}</p>
    {% endif %}
    {% if help %}
        <p{% if field.auto_id %} id="{{ field.auto_id }}_help"{% endif %} class="text-xs text-gray-400 dark:text-gray-500">{{ help }}</p>
    {% endif %}
</div>
