{% load i18n %}
{# One label / value / copy row of _bank_transfer_details.html. copyValue lives in js/alpine/core.js. #}
<div class="rounded-xl px-3 py-2 bg-gray-50 dark:bg-white/10 border border-gray-200 dark:border-white/20">
    <dt class="text-[11px] font-bold uppercase tracking-wider text-gray-500 dark:text-purple-300">{{ label }}</dt>
    <dd class="m-0 flex items-center justify-between gap-2">
        <span class="min-w-0 font-semibold text-gray-900 dark:text-white break-all{% if mono %} font-mono{% endif %}">{{ value }}</span>
        {# Hidden until Alpine confirms the Clipboard API: the value stays selectable without it. #}
        <button type="button"
                x-data="copyValue"
                x-show="supported"
                x-cloak
                data-value="{{ copy_value }}"
                data-label="{% trans 'Copy' %}"
                data-label-copied="{% trans 'Copied!' %}"
                @click="copy"
                x-text="label"
                aria-label="{% blocktrans %}Copy {{ label }}{% endblocktrans %}"
                class="flex-shrink-0 text-xs font-semibold px-2.5 py-1 rounded-lg text-pink-700 dark:text-pink-200 bg-pink-50 dark:bg-pink-500/20 border border-pink-200 dark:border-pink-400/30 hover:bg-pink-100 dark:hover:bg-pink-500/30 focus:outline-none focus:ring-2 focus:ring-pink-500 cursor-pointer">{% trans "Copy" %}</button>
    </dd>
</div>
