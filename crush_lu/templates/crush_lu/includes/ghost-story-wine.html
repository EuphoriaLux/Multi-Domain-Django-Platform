<svg xmlns="http://www.w3.org/2000/svg" viewBox="89 75 318 325" class="{{ class|default:'w-7 h-7' }}" aria-hidden="true">
  {# Ghost Story - Wine Ghost: savouring a swirling glass of red wine, grapes nearby. Used on the featured tasting formula. #}
  <defs>
    <clipPath id="wine-ghost-bowl">
      <path d="M-24,-52 Q-26,-8 0,0 Q26,-8 24,-52 Z"/>
    </clipPath>
    <linearGradient id="wine-ghost-wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B0174A"/>
      <stop offset="1" stop-color="#5B0B2A"/>
    </linearGradient>
  </defs>

  <!-- Grapes, gently bobbing on the left -->
  <g transform="translate(128,150)">
    <animateTransform attributeName="transform" type="translate" values="128 150;128 143;128 150" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <path d="M2,-26 Q10,-36 22,-34 Q14,-24 2,-26Z" fill="#4ADE80"/>
    <line x1="0" y1="-26" x2="0" y2="-14" stroke="#8B5E34" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-9" cy="-8" r="8" fill="#7C3AED"/>
    <circle cx="8" cy="-8" r="8" fill="#6D28D9"/>
    <circle cx="0" cy="5" r="8" fill="#7C3AED"/>
    <circle cx="-15" cy="6" r="7" fill="#6D28D9"/>
    <circle cx="15" cy="6" r="7" fill="#8B5CF6"/>
    <circle cx="-7" cy="18" r="7" fill="#6D28D9"/>
    <circle cx="8" cy="18" r="7" fill="#7C3AED"/>
    <circle cx="0" cy="30" r="6" fill="#8B5CF6"/>
    <circle cx="-11" cy="-11" r="2.5" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="5" cy="-11" r="2.5" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <g>
    <!-- Contented float -->
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>

    <g>
      <!-- Slow, savouring sway -->
      <animateTransform attributeName="transform" type="rotate" values="0 248 230;-3 248 230;0 248 230;3 248 230;0 248 230" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/>

      <!-- Ghost body -->
      <path d="M0 0 C20.10256691 16.26024803 34.87819428 37.57947896 38.1875 63.76953125 C38.46074249 68.12006401 38.59879554 72.45510272 38.6875 76.8125 C39.49397619 108.73115191 42.19992181 139.06430556 66.3359375 162.734375 C70.00595213 165.97764375 73.95948905 168.8070311 77.953125 171.63671875 C82.9917218 175.64600221 85.36027289 179.29625985 86.48828125 185.546875 C86.87339201 189.92656604 85.95121208 193.0673738 83.375 196.625 C77.90943725 202.72120461 70.88920791 205.2992975 63.3359375 208.01953125 C50.85398343 212.53885945 45.98921795 218.32090001 39.01953125 229.25390625 C33.70859595 237.46871692 27.49316695 242.9501775 17.75 245.25 C10.388348 246.38875554 3.34927772 245.1730557 -3.875 243.6875 C-10.12959473 242.53978632 -15.95813152 241.87814751 -21.65625 245.1640625 C-25.54523688 248.08080266 -28.92792527 251.39678091 -32.3125 254.875 C-40.66120582 263.40519942 -50.43310595 268.95599728 -62.5 269.25 C-73.76530721 268.87286769 -82.79467839 262.91379118 -90.50390625 254.9375 C-92.75099008 252.29729783 -94.73016862 249.50490583 -96.75 246.6875 C-101.32320213 240.49429915 -105.56878234 236.26373689 -113.3125 234.875 C-116.79371116 234.61863174 -119.69589039 235.36413376 -123.0546875 236.3125 C-130.93101016 238.05673754 -138.12014382 237.43490546 -145.13671875 233.40625 C-151.75307285 228.55980032 -154.82181713 221.11947486 -158.2109375 213.86328125 C-163.63290399 205.99235963 -172.98560762 204.06453593 -181.7109375 201.49609375 C-188.522037 199.37992844 -193.06039335 197.11558975 -197.1875 191.0625 C-199.03855323 185.71501288 -199.07285512 181.04883859 -197.25 175.6875 C-193.32438105 169.86238801 -188.78887337 165.98205892 -182.8125 162.3125 C-169.50322089 154.0690993 -162.68158781 141.23950933 -157.3125 126.8125 C-156.95414063 125.96300781 -156.59578125 125.11351562 -156.2265625 124.23828125 C-150.92114519 110.57583443 -150.52313764 94.93878212 -149.65063477 80.45727539 C-147.95656368 52.97761837 -140.00209136 27.24778404 -119.52734375 7.74609375 C-86.66535       <!-- Eyes closed in delight: savouring the wine -->
      <path d="M190,196 Q203,182 216,196" fill="none" stroke="#27183f" stroke-width="7" stroke-linecap="round"/>
      <path d="M259,196 Q272,182 285,196" fill="none" stroke="#27183f" stroke-width="7" stroke-linecap="round"/>

      <!-- Rosy cheeks, a little wine-flushed -->
      <ellipse cx="183" cy="220" rx="15" ry="9" fill="#FF6FA8" opacity="0.5">
        <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="302" cy="220" rx="15" ry="9" fill="#FF6FA8" opacity="0.5">
        <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" begin="0.4s" repeatCount="indefinite"/>
      </ellipse>

      <!-- Satisfied smile -->
      <path d="M226,236 Q244,252 262,236" fill="none" stroke="#27183f" stroke-width="6" stroke-linecap="round"/>

      <!-- Wine glass held on the right, swirling -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 348 262;-9 348 262;0 348 262;9 348 262;0 348 262" additive="replace" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/>
        <g transform="translate(348,262) scale(1.35)">
          <!-- Wine, its surface sloshing inside the bowl -->
          <g clip-path="url(#wine-ghost-bowl)">
            <path d="M-30,-24 Q-15,-30 0,-24 Q15,-18 30,-24 L30,4 L-30,4 Z" fill="url(#wine-ghost-wine)">
              <animate attributeName="d" values="M-30,-24 Q-15,-30 0,-24 Q15,-18 30,-24 L30,4 L-30,4 Z;M-30,-22 Q-15,-16 0,-24 Q15,-31 30,-26 L30,4 L-30,4 Z;M-30,-24 Q-15,-30 0,-24 Q15,-18 30,-24 L30,4 L-30,4 Z" dur="2.4s" repeatCount="indefinite"/>
            </path>
          </g>
          <!-- Bowl outline and shine -->
          <path d="M-24,-52 Q-26,-8 0,0 Q26,-8 24,-52" fill="#FFFFFF" fill-opacity="0.18" stroke="#E9D5FF" stroke-width="3" stroke-linejoin="round"/>
          <path d="M-15,-44 Q-17,-22 -9,-12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
          <!-- Stem and foot -->
          <line x1="0" y1="0" x2="0" y2="32" stroke="#E9D5FF" stroke-width="3.5" stroke-linecap="round"/>
          <ellipse cx="0" cy="33" rx="15" ry="4" fill="#E9D5FF"/>
        </g>
      </g>
      <!-- Little hand holding the stem -->
      <ellipse cx="340" cy="286" rx="14" ry="11" fill="#FFF5FA" stroke="#F3D9E8" stroke-width="2"/>
    </g>
  </g>

  <!-- Hearts drifting up from the glass -->
  <g fill="#E11D48">
    <path d="M0,0 C-4,-5 -10,-1 0,7 C10,-1 4,-5 0,0Z" transform="translate(362,180)" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="362 180;372 132" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M0,0 C-3,-4 -8,-1 0,5 C8,-1 3,-4 0,0Z" transform="translate(332,186)" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="332 186;320 140" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Sparkles -->
  <g fill="#FCD34D">
    <path d="M0,-7 L2,-2 L7,0 L2,2 L0,7 L-2,2 L-7,0 L-2,-2Z" transform="translate(380,120)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-5 L1.5,-1.5 L5,0 L1.5,1.5 L0,5 L-1.5,1.5 L-5,0 L-1.5,-1.5Z" transform="translate(110,250)">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
