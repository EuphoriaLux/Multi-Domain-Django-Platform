# Security Scanning Workflow
# Runs security scans on PRs and pushes to detect vulnerabilities early
name: Security Scan

on:
  pull_request:
    branches:
      - main
      - develop
    # Security Summary must report on every PR, including documentation/config.
  workflow_dispatch:
  schedule:
    # Run weekly on Sundays at midnight UTC for baseline security checks
    - cron: '0 0 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions for security
permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  # Python dependency vulnerability scanning
  dependency-scan:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        shell: bash
        run: |
          set -uo pipefail
          echo "🔍 Scanning Python dependencies for vulnerabilities..."
          log="$RUNNER_TEMP/pip-audit.log"

          # A PyPI/OSV outage (e.g. "503 Backend is unhealthy") makes pip-audit crash
          # with pip_audit._service.interface.ServiceError before any audit runs, and
          # it exits non-zero just like a real finding. Retry those with backoff on
          # PyPI, then fall back to OSV, and only report findings pip-audit printed.
          run_audit() {
            # PYSEC-2025-183 (PyJWT weak-key advisory) is disputed by PyJWT maintainers
            # and has no fix version available. PyJWT==2.12.1 is already the latest release
            # and was pinned to resolve CVE-2026-32597. Ignored until a patched release exists.
            pip-audit -r requirements.txt --desc on --fix --dry-run \
              --ignore-vuln PYSEC-2025-183 \
              --vulnerability-service "$1" 2>&1 | tee "$log"
          }
          is_service_error() {
            grep -qE 'ServiceError|ConnectionError|ReadTimeout' "$log"
          }

          rc=1
          for service in pypi osv; do
            [ "$service" = pypi ] && attempts=3 || attempts=2
            for attempt in $(seq 1 "$attempts"); do
              echo "── pip-audit ($service, attempt $attempt/$attempts) ──"
              rc=0
              run_audit "$service" || rc=$?
              if [ "$rc" -eq 0 ] || ! is_service_error; then
                break 2
              fi
              echo "::warning::pip-audit hit a $service service error (attempt $attempt/$attempts)"
              if [ "$attempt" -lt "$attempts" ]; then
                sleep $((15 * attempt))
              fi
            done
          done

          if [ "$rc" -eq 0 ]; then
            echo "✅ No known vulnerabilities in dependencies"
          elif is_service_error; then
            echo "::error::Vulnerability services (PyPI and OSV) unavailable — no audit ran. Re-run the job later."
            exit 1
          elif grep -qE 'Found [0-9]+ known vulnerabilit' "$log"; then
            echo "⚠️ Vulnerabilities found! Review above output."
            exit 1
          else
            echo "::error::pip-audit failed (exit $rc) without reporting vulnerabilities. Review above output."
            exit 1
          fi

  # Static Application Security Testing (SAST) for Python
  sast-scan:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit Security Scan
        run: |
          echo "🔍 Running Bandit security analysis..."
          bandit -r . \
            --exclude "*/migrations/*,*/venv/*,*/.venv/*,*/tests/*,*/test_*" \
            -ll \
            -f json \
            -o bandit-report.json || true

          # Check for high severity issues
          HIGH_COUNT=$(python -c "import json; r=json.load(open('bandit-report.json')); print(len([i for i in r.get('results',[]) if i['issue_severity']=='HIGH']))")
          MEDIUM_COUNT=$(python -c "import json; r=json.load(open('bandit-report.json')); print(len([i for i in r.get('results',[]) if i['issue_severity']=='MEDIUM']))")

          echo "Found: $HIGH_COUNT high severity, $MEDIUM_COUNT medium severity issues"

          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "❌ High severity security issues found!"
            bandit -r . --exclude "*/migrations/*,*/venv/*,*/.venv/*,*/tests/*,*/test_*" -ll
            exit 1
          fi

          echo "✅ No high severity security issues"

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

  # Secrets scanning with GitLeaks
  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Summary job
  security-summary:
    name: Security Summary
    needs: [dependency-scan, sast-scan, secrets-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json
          import os

          needs = json.loads(os.environ['CI_NEEDS'])
          failed = [job for job, state in needs.items() if state['result'] != 'success']
          for job, state in needs.items():
              print(f"{job}: {state['result']}")
          if failed:
              raise SystemExit('::error::Security checks failed: ' + ', '.join(failed))
          print('All security checks passed.')
