name: Android Build Verification

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-build-verification.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-build-verification.yml'

jobs:
  build-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Android source guards
        run: python3 -m unittest discover -s mobile/android/CrushLU/tests -v

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build Android App (Debug and Unsigned Release)
        working-directory: mobile/android/CrushLU
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          chmod +x ./gradlew
          ./gradlew assembleDebug bundleRelease
