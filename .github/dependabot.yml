# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Luxembourg"
    open-pull-requests-limit: 5
    reviewers:
      - "EuphoriaLux"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # TEMPORARY — remove once a DRF release carries the fix (see below).
    # Django 6.1 dropped django.utils.cache.cc_delim_re, which djangorestframework
    # <=3.17.2 still imports at module scope, so azureproject/urls.py fails to import
    # and every job that loads the root URLconf dies (#811, fixed by #834). DRF replaced
    # it with split_header_value upstream (encode/django-rest-framework#9978) but has not
    # released it, so without this entry Dependabot re-proposes 6.1 every Monday and the
    # PR is red every time. The bound is >=6.1 rather than 6.1.x because the symbol stays
    # removed in later majors/minors too. Django 6.0.x patch releases — the security
    # channel that actually applies to the pinned version — are NOT affected by this.
    ignore:
      - dependency-name: "Django"
        versions: [">=6.1"]
    # Group minor and patch updates together
    groups:
      django-ecosystem:
        patterns:
          - "Django*"
          - "django-*"
      azure-ecosystem:
        patterns:
          - "azure-*"
          - "msal*"
      # Catch-all: every remaining minor/patch bump lands in ONE weekly PR.
      # Majors still arrive as individual PRs for case-by-case review.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # npm dependencies (Tailwind CSS and build tools)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Luxembourg"
    open-pull-requests-limit: 3
    reviewers:
      - "EuphoriaLux"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      tailwind-ecosystem:
        patterns:
          - "tailwindcss*"
          - "@tailwindcss/*"
          - "postcss*"
          - "autoprefixer*"
      # Catch-all: every remaining minor/patch bump lands in ONE weekly PR.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Luxembourg"
    open-pull-requests-limit: 3
    reviewers:
      - "EuphoriaLux"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      # Action tag bumps are low-risk within a major; batch minors/patches.
      # Majors (e.g. apple-actions v1->v5) stay individual for review.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
