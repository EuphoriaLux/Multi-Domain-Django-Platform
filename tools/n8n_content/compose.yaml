# Merge into the existing svc stack after completing the rollout checklist.
services:
  content-renderer:
    build:
      context: .
      dockerfile: Dockerfile.renderer
    restart: unless-stopped
    environment:
      RENDERER_TOKEN: ${RENDERER_TOKEN:?Configure the renderer secret}
    volumes:
      - /home/svc/.local/share/docker/volumes/n8n_n8n_data/_data/assets:/assets:ro
    # Keep service reachable only on the shared Docker network.
    networks: [n8n]
  content-review:
    build:
      context: .
      dockerfile: Dockerfile.review
    restart: unless-stopped
    environment:
      REVIEW_TOKEN: ${REVIEW_TOKEN:?Configure the review secret}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Configure a dedicated review bot}
      HUB_ADMIN_API_KEY: ${HUB_ADMIN_API_KEY:?Configure Hub authentication}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?Configure the review chat}
      TELEGRAM_REVIEWER_IDS: ${TELEGRAM_REVIEWER_IDS:?Configure numeric reviewer IDs}
      ENABLE_PUBLISH: ${ENABLE_PUBLISH:-false}
      PREVIEW_ONLY: ${PREVIEW_ONLY:-false}
      REGENERATE_URL: http://n8n:5678/webhook/crush-visual-regenerate-v2
    volumes:
      - content_reviews:/data
    networks: [n8n]
volumes:
  content_reviews:
networks:
  n8n:
    external: true
    name: n8n_default
